name = "AgentVerifier"
version = "0.1.0"
defaultTargets = ["agentverifier"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.20.0"

[[lean_lib]]
name = "AgentVerifier"

[[lean_lib]]
name = "TestVerifications"
globs = ["TestVerifications.*"]

[[lean_exe]]
name = "agentverifier"
root = "Main"

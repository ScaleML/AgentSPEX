name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Build Docker image
      run: |
        docker build -t virtual-sandbox:latest -f config/Dockerfile .

    - name: Start sandbox container
      run: |
        # Create workspace directory
        mkdir -p workspace
        chmod 777 workspace

        # Start the container
        docker run -d \
          --name sandbox \
          --hostname sandbox \
          --env-file config/vm.env \
          -e USER_PASSWORD=testpassword \
          -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || '' }} \
          -v "$(pwd)/workspace:/workspace:rw" \
          -p 7002:7002 \
          virtual-sandbox:latest

    - name: Wait for sandbox to start
      run: |
        echo "Waiting 15 seconds for sandbox to start..."
        sleep 15

    - name: Run tests
      env:
        MCP_URL: http://localhost:7002/mcp
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest -v --tb=short

    - name: Show container logs on failure
      if: failure()
      run: |
        echo "=== Container logs ==="
        docker logs sandbox
        echo "=== Container status ==="
        docker ps -a

    - name: Stop sandbox container
      if: always()
      run: |
        docker stop sandbox || true
        docker rm sandbox || true

name: "ai_scientists_writer"
goal: "Generate a scientific proposal paper from research idea and experiment plan"

# Writer submodule config
config:
    model: "gpt-5.2"
    max_tokens_per_step: 200000
    max_tool_calls_per_step: 30
    plan_revision_max_steps: 0

parameters:
    idea_file: "${IDEA_FILE:-${AGENTSPEX_RUN_SANDBOX_DIR_ABS}/thinker/step-2-final-ideas.json}"
    # Defaults to the per-run sandbox dir; parent workflows override via env.
    output_dir: "${OUTPUT_DIR:-${AGENTSPEX_RUN_SANDBOX_DIR_ABS}/writer}"
    # When true: ignore this HighQuality workflow and delegate to ai_scientists_writer_costefficiency.yaml (cost-efficient writer).
    # When false: run this HighQuality workflow normally.
    paper_format: "${PAPER_FORMAT:-latex}"
    include_preliminary_results: "${INCLUDE_PRELIMINARY_RESULTS:-false}"
    memory_file: "${MEMORY_FILE:-${AGENTSPEX_RUN_SANDBOX_DIR_ABS}/writer/memory.json}"
    max_citation_workers: "${MAX_CITATION_WORKERS:-3}"
    latex_main_template: |
        \documentclass{article}

        \usepackage{PRIMEarxiv}

        \usepackage{algorithm}

        \usepackage{algorithmic}

        \usepackage{amsmath}

        \usepackage{natbib}

        \usepackage[utf8]{inputenc} % allow utf-8 input

        \usepackage[T1]{fontenc}    % use 8-bit T1 fonts

        \usepackage{hyperref}       % hyperlinks

        \usepackage{url}            % simple URL typesetting

        \usepackage{booktabs}       % professional-quality tables

        \usepackage{amsfonts}       % blackboard math symbols

        \usepackage{nicefrac}       % compact symbols for 1/2, etc.

        \usepackage{microtype}      % microtypography

        \usepackage{lipsum}

        \usepackage{fancyhdr}       % header

        \usepackage{graphicx}       % graphics

        \graphicspath{{media/}}     % organize your images and other figures under media/ folder

        %Header

        \pagestyle{fancy}

        \thispagestyle{empty}

        \rhead{ \textit{ }} 

        % Update your Headers here

        \fancyhead[LO]{TITLE_PLACEHOLDER}

        % \fancyhead[RE]{Firstauthor and Secondauthor} % Firstauthor et al. if more than 2 - must use \documentclass[twoside]{article}

        %% Title

        \title{TITLE_PLACEHOLDER}

        \author{
          OptimalScale AIScientist
        }

        \begin{document}

        \maketitle

        \input{sections/abstract}

        \input{sections/introduction}

        \input{sections/related_work}

        \input{sections/method}

        \input{sections/experimental_setup}

        %Bibliography

        \bibliographystyle{unsrt}  

        \bibliography{sections/references}  

        \end{document}
    citation_system_prompt: |
        Your current task is helping add and embed citation coverage in a research paper.

        Your role:
        - When asked to suggest citations, return only real, published academic paper titles that are highly relevant to the given content.
        - When asked to embed citations, you will be provided with papers in the format: [CITE_KEY: bibtex_key] Paper Title (authors, venue, year)
        - You MUST extract and use the EXACT bibtex_key from [CITE_KEY: bibtex_key] when inserting `\cite{bibtex_key}` commands.
        - For example, if you see [CITE_KEY: smith2023nlp] Natural Language Processing..., you must write \cite{smith2023nlp}
        - NEVER invent citation keys - only use the keys explicitly provided in [CITE_KEY: ...]

        **CRITICAL - MEANINGFUL CITATION PLACEMENT**:
        - Each citation MUST support a specific claim, method, finding, or statement in that sentence
        - Citations should be placed immediately after the claim they support
        - Do NOT randomly insert citations without clear relevance to the sentence content
        - If a paper is not directly relevant to a specific claim, do NOT force it into that sentence
        - Each citation should have a clear purpose: supporting a claim, referencing a method, citing prior work, etc.

        Do not invent or fabricate any citations.
        Do not output BibTeX, author names, or publication details.

        **CRITICAL - LaTeX Format Only (NO Markdown)**:
        - Use \textbf{text} for bold, NOT **text**
        - Use \textit{text} for italic, NOT *text*
        - Use \texttt{text} for code/monospace, NOT `text`
        Be thorough - missing citations is not acceptable
        Always follow the expected output format (JSON array or updated LaTeX content), with no extra commentary or explanation.
    write_system_prompt: |
        Your current task to write a proposal aiming to publish a paper that will contribute significantly to the field.
        You have already figured out the research idea and the experiments you want to run.

        **IMPORTANT - Citation Principles**:
        - Each citation must support a specific claim, statement, or finding in that sentence
        - Citations should be placed right after the claim they support
        - Do NOT add citations randomly or at the end of unrelated sentences
        - Only cite papers that are directly relevant to the specific content of that sentence
        - Use \cite{} or \citet{} to reference papers in references.bib

        **CRITICAL - LaTeX Format Only (NO Markdown)**
        - NEVER mix Markdown and LaTeX syntax (e.g., **text\textbf{ is WRONG)
        - Use \textbf{text} for bold, NEVER **text**
        - Use \textit{text} for italic, NEVER *text*
        - Use \texttt{text} for code/monospace, NEVER `text`
        - Example: \textbf{Data Collection}: not **Data Collection**: or **Data Collection\textbf{
        - When including tables, always use proper LaTeX tabular format (not Markdown)
        - Avoid using Markdown-style tables (e.g., those starting with `| Column |`) — they are not compatible with LaTeX rendering and will break the document
        - For algorithms, use \begin{algorithmic}...\end{algorithmic} with \STATE, \FOR{...}, \IF{...}, \WHILE{...}, \ENDFOR, \ENDIF, \ENDWHILE (uppercase commands)

        [LaTeX Formatting Reminder]
        - **CRITICAL**: Always use `\%` for percentage values (e.g., 93\%), NEVER use bare `%` as it becomes a comment in LaTeX
        - For actual LaTeX comments, use `% comment` (without backslash)
        - Wrap math expressions with `$...$`
        - Escape special characters by prefixing them with a backslash, `_` as `\_`, `&` as `\&`, `#` as `\#`, etc.
        - For algorithms, use uppercase commands like:
            \begin{algorithm}
            \caption{Algorithm Name}
            \begin{algorithmic}
            \STATE Initialize parameters $\theta$
            \FOR{each iteration $t = 1$ to $T$}
                \STATE Update $\theta$ using gradient
            \ENDFOR
            \end{algorithmic}
            \end{algorithm}

        [Equation Length Guidelines - CRITICAL]
        - **NEVER write equations that exceed one line width**
        - For long equations, use multi-line environments:
            * \begin{align}...\end{align} for multiple aligned equations
            * \begin{multline}...\end{multline} for single equation split across lines
            * \begin{split}...\end{split} inside equation environment
        - Break equations at operators (+, -, =, \cdot, etc.)
        - Use concise notation: prefer $h_t$ over $h_{timestep}$
        - Example of proper line breaking:
            \begin{align}
            \mathcal{L} &= \sum_{i=1}^N \left( f(x_i; \theta) - y_i \right)^2 \\
                        &\quad + \lambda \|\theta\|_2^2
            \end{align}
    write_system_prompt_related_work: |
        Your current task is looking to publish a paper that will contribute significantly to the field.
        You have already figured out the research idea and the experiments you want to run.
    related_work_tips: |
        - Academic siblings of our work, i.e. alternative attempts in literature at trying to solve the same problem.
        - Goal is to "Compare and contrast" - how does their approach differ in either assumptions or method? If their method is applicable to our Problem Setting I expect a comparison in the experimental section. If not, there needs to be a clear statement why a given method is not applicable.
        - Note: Just describing what another paper is doing is not enough. We need to compare and contrast.
        - **STRUCTURE REQUIREMENT**: Write **3 paragraphs** (at most 4 paragraphs). Each paragraph should focus on a distinct category or theme of related work.
    introduction_tips: |
        - Write 5 paragraphs for the instructions. Each paragraph should answer one question.
        - paragraph1: What is the problem?
            * Start broad with background and context
            * Narrow down to the specific gap or unsolved issue
            * End with a sharp statement of the problem
            * probably end the paragraph with a question like: Can LLM simulate social interactions?

        - paragraph2: Why is it interesting and important?
            * Connect to research community demand
            * Tie to trends or consensus in the field
            * Show broader impact or urgency

        - paragraph3: Why is it hard? (E.g., why do naive approaches fail?)
            * Explain inherent difficulty of the problem
            * Give examples of why naive approaches fail
            * Clarify how these challenges block real progress

        - paragraph4: Why hasn't it been solved before?
            (Or, what's wrong with previous proposed solutions? How does mine differ?)
            * Acknowledge prior work and attempts
            * Point out their shortcomings or gaps
            * Clearly state how your approach differs and improves

        - paragrap5: What are the key components of my approach and results?
            * Introduce your core approach in one sentence
            * Break into 2–3 main components
            * Summarize key results
    abstract_tips: |
        - TL;DR of the paper
        - What are we trying to do and why is it relevant?
        - Why is this hard?
        - How do we solve it (i.e. our contribution!)
        - How do we verify that we solved it (e.g. Experiments and results)

        Please make sure the abstract reads smoothly and is well-motivated. This should be one continuous paragraph with no breaks between the lines. Should not be too long, try to grab its important points. Each point should only have one or two sentences.
    method_tips: |
        - Start with Problem Definition (First Paragraph)
          Clearly define the task my method aims to solve using precise mathematical notation.
          Specify the input space, output space, and the target mapping/function.
          Introduce any necessary notations, symbols, or assumptions upfront.
          Keep it focused on the problem formulation, not experiments.

        - Use Math to Describe the Algorithm / Model
          Describe the entire method in a conceptual and mathematical way.
          Define each core component of the method formally (e.g., functions, modules, transformations).
          Use equations to explain how the method processes input and produces output step by step.
          Keep the description general — no datasets, hyperparameters, or training tricks.

        - Explain the Motivation for Each Design Choice
          Before describing each component, give a brief, high-level motivation for why it is designed this way (e.g., address a limitation, exploit a property).
          Do not dump design details without explaining their purpose first.

        - Focus on the Core Algorithm / Architecture / Key Innovations
          Highlight what is new in the method compared to existing approaches.
          Structure the section around the main pipeline of the algorithm, not around implementation details.
          If appropriate, include pseudo-code or algorithm boxes, but only if they clarify the method.

        - Avoid Experimental Details
          Do NOT include anything about dataset splits, training hyperparameters, model sizes, implementation tricks, or computational setup.
          Those belong in the Experimental Setup section.

        - End with a High-Level Summary (Optional)
          Optionally, conclude with a short paragraph summarizing the overall workflow and emphasizing why the method is well-suited for the problem.
    experimental_setup_tips: |
        - How do we test that our stuff works? Introduces a specific instantiation of the Problem Setting and specific implementation details of our Method for this Problem Setting.
        - Do not imagine unknown hardware details.
        - Includes a description of the dataset, evaluation metrics, important hyperparameters, and implementation details.
        - For a proposal, focus on the experimental setup and plan, not results.

workflow:
    - set_variable:
        name: "all_citation"
        value: "[]"

    # Step 1: Setup - Create output directory structure
    - task:
        name: "setup_environment"
        instruction: |
            Use fs_mkdir tool to create the following directory structure:
            - {{output_dir}}/sections
            - {{output_dir}}/figures (for future use)

            Return confirmation that all directories have been created.
        save_as: "setup_result"

    # Step 2: Load Idea (as text, no JSON parsing required)
    - task:
        name: "load_idea"
        instruction: |
            **CRITICAL - SINGLE TOOL CALL ONLY**:
            You MUST call fs_read tool ONCE and then immediately return the content.
            DO NOT call fs_read multiple times.
            DO NOT re-read the file after receiving the content.

            Use fs_read tool to read the idea file at {{idea_file}}.

            **CRITICAL**: Do NOT use max_bytes=0. Use max_bytes=10485760 or omit the parameter.

            **SIMPLE TASK - READ AS TEXT**:
            After reading the file, simply return the entire file content as text.
            DO NOT parse, extract, or reformat the content.
            DO NOT validate JSON format.
            Just return the complete text content that was read from the file.

            **EXECUTION STEPS** (execute in order, stop after step 2):
            1. Call fs_read tool with path: {{idea_file}}
            2. Once you receive the file content in the tool response, immediately return that content as your final answer
            3. DO NOT call any other tools after receiving the file content
            4. DO NOT call fs_read again - you already have the content

            **IMPORTANT**: The tool response will contain the file content in the "text" field. Extract that text and return it directly.

        save_as: "idea_data"


    # Step 2.1: Create main.tex with Title from idea_data (using LLM for string replacement)
    # This step uses LLM to perform the string replacement to avoid eval() issues with multi-line strings
    - task:
        name: "create_main_tex_content"
        instruction: |
            **CRITICAL - STRING REPLACEMENT TASK ONLY**:
            You must perform a simple string replacement: replace `TITLE_PLACEHOLDER` with the actual title.
            
            **INPUTS PROVIDED**:
            - LaTeX Template (contains `TITLE_PLACEHOLDER` in two places): {{latex_main_template}}
            
            - Research Idea: {{idea_data}}

            **TITLE EXTRACTION RULE (IMPORTANT)**:
            - Extract the paper title from the Research Idea shown above (look for the `Title` field / JSON key `"Title"`).
            - The actual title to insert is the extracted Title VALUE (plain text), NOT the literal string `idea_data`.
            
            **YOUR TASK**:
            1. Take the LaTeX template above
            2. Find ALL occurrences of the exact string `TITLE_PLACEHOLDER`
            3. Replace each `TITLE_PLACEHOLDER` with the extracted title text
            4. Return ONLY the complete modified LaTeX template (with Title inserted)
            
            
            **CRITICAL - OUTPUT REQUIREMENTS**:
            - Return ONLY the complete LaTeX template text
            - DO NOT include any explanations, comments, or additional text
            - DO NOT use any tools (fs_write, fs_read, fs_mkdir, etc.)
            - DO NOT modify any part of the template except replacing `TITLE_PLACEHOLDER`
            - DO NOT add or remove any lines
            - The output should be the exact same template, but with `TITLE_PLACEHOLDER` replaced by the title
            
            **EXAMPLE**:
            If the template contains:
            ```
            \fancyhead[LO]{TITLE_PLACEHOLDER}
            \title{TITLE_PLACEHOLDER}
            ```
            
            And the title is "My Research Title", then return:
            ```
            \fancyhead[LO]{My Research Title}
            \title{My Research Title}
            ```
            
            **NOW PERFORM THE REPLACEMENT AND RETURN THE COMPLETE TEMPLATE**:
        save_as: "main_tex_content"
    
    # Step 2.2: Save main.tex file
    - task:
        name: "save_main_tex"
        instruction: |
            **CRITICAL - ONLY ONE OPERATION ALLOWED**:
            Use fs_write to save the main.tex content that was prepared in the previous step.
            
            **ALL OTHER OPERATIONS ARE FORBIDDEN**:
            - DO NOT modify the content
            - DO NOT use any other tools (fs_read, fs_mkdir, etc.)
            - DO NOT ask for confirmation
            - DO NOT provide explanations or suggestions
            
            **CONTENT TO SAVE**:
            The main.tex content has already been prepared in the previous step and is stored in context variable 'main_tex_content'.
            
            **CRITICAL - CONTENT BOUNDARIES**:
            The content to save is the VALUE of the context variable 'main_tex_content'.
            This variable contains the COMPLETE LaTeX template with Title already inserted.
            
            ========== CONTENT TO SAVE (START) ==========
            {{main_tex_content}}
            ========== CONTENT TO SAVE (END) ==========
            
            **EXECUTION STEPS** (execute immediately, no questions):
            1. Extract the content between "CONTENT TO SAVE (START)" and "CONTENT TO SAVE (END)" markers above.
            2. This content is the VALUE of 'main_tex_content' variable (the LaTeX template with Title).
            3. Call fs_write tool with:
               - path: {{output_dir}}/sections/main.tex
               - content: (ONLY the content between the markers, nothing else)
               - mode: "text"
            4. Return ONLY: "File saved: {{output_dir}}/sections/main.tex"
            
            **CRITICAL - DO NOT MODIFY CONTENT**:
            - DO NOT change anything
            - DO NOT modify any part of the LaTeX template
            - DO NOT add or remove any characters
            - Save the content EXACTLY as shown between the markers
            
            **DO NOT**:
            - Save instruction text, markers, or any explanation
            - Use any other tools
            - Ask questions or provide explanations
        save_as: "save_main_tex_result"

    # Step 3: Create initial citation query for related work
    - task:
        name: "create_init_citation_query_for_related_work"
        instruction: |
            {{citation_system_prompt}}

            You will generate search queries to find relevant papers for citation in the Related Work section.

            **CONTEXT**:
            - Idea: {{idea_data}}
                Focus on fields: Title, Problem, Importance, Difficulty, NoveltyComparison, Approach, Experiment etc.

            - Section Content:
                None

            **YOUR TASK**: Read the IDEA and SECTION CONTENT above and extract 2-3 SPECIFIC technical terms FROM THEM to create 3 search queries.

            **CRITICAL STEP-BY-STEP**:
            1. READ the idea and the section snippet carefully
            2. IDENTIFY specific techniques/algorithms/models (e.g., "graph attention network", "knowledge distillation", "BERT")
            3. IDENTIFY the task/application when present (e.g., "link prediction", "question answering")
            4. CREATE queries as: "specific_technique AND specific_task" (if task is present), otherwise combine 2-3 specific techniques
            5. DO NOT use generic terms; use only concrete technical terminology

            **TYPES OF SPECIFIC TERMS TO EXTRACT**:
            ✅ Specific models: "BERT", "GPT-4", "T5", "ResNet"
            ✅ Specific architectures: "graph attention network", "encoder-decoder"
            ✅ Specific techniques: "knowledge distillation", "contrastive learning", "adversarial training"
            ✅ Specific mechanisms: "multi-head attention", "cross-attention", "tree-based reasoning"
            ✅ Specific tasks: "question answering", "sentiment analysis", "link prediction"
            ✅ Specific datasets/benchmarks: "SQuAD", "GLUE", "ImageNet"

            **WHAT TO AVOID**:
            ❌ "deep learning", "machine learning", "AI"
            ❌ "neural networks" (specify which type)
            ❌ Domain-only terms: "NLP", "CV"
            ❌ Vague phrases: "improve performance", "state-of-the-art"

            **FORMAT EXAMPLES** (structure only):
            - If idea/snippet mentions "BERT for question answering" → "BERT AND question answering"
            - If mentions "graph attention on citation networks" → "graph attention network AND citation network"
            - If discusses "knowledge distillation for language models" → "knowledge distillation AND language model"

            **OUTPUT FORMAT**:
            Return ONLY a JSON array of 3 query strings with no extra commentary.

            Example:
            [
                "graph attention network AND link prediction",
                "knowledge distillation AND language model",
                "multi-head attention AND machine translation",
                ...
            ]
        save_as: "initial_citation_query_for_related_work"

    # Step 4: Prepare parallel params for related work citation search
    - task:
        name: "prepare_citation_search_params_for_related_work"
        instruction: |
            From the citation queries: {{initial_citation_query_for_related_work}}

            Create a parameter list for parallel citation search module calls.

            For each query in the list:
            Create a parameter dictionary:
            {
                "query": "the search query",
                "max_papers": 1
            }

            Combine all into a single list:
            [
                {"query": "query1", "max_papers": 1},
                {"query": "query2", "max_papers": 1},
                ...
            ]

            Return ONLY the JSON array with no extra commentary.
        save_as: "citation_search_params_related_work"

    # Step 5: Parallel Citation Search for Related Work
    - parallel:
        module: "./modules/search_citations.yaml"
        parameters_list: "citation_search_params_related_work"
        save_results_as: "related_work_citations_raw"
        max_workers: "max_citation_workers"


    # Step 6: Process the searched citations into a list
    - set_variable:
        name: "related_work_citations"
        value: "sum (list( {{related_work_citations_raw}}.values() ), [] )"
    
    # Step 6.5: Normalize bibtex keys to LastName_Year format
    - task:
        name: "normalize_related_work_citation_keys"
        instruction: |
            **CRITICAL TASK**: Normalize bibtex keys to LastName_Year format. Process the citations list below and return a complete Python list.
            
            **NO TOOLS ALLOWED** - Return ONLY the modified list, no file operations.
            
            Citations list:
            {{related_work_citations}}
            
            **REQUIREMENTS**:
            1. For each citation, extract the bibtex key (after @type{ and before first comma)
            2. If key is NOT LastName_Year format (e.g., URL):
               - Extract FIRST author's LAST NAME from bibtex 'author' field
               - Extract 'year' from bibtex
               - Generate key: LastName_Year (e.g., "Alakhdar_2025")
               - If missing author/year: use "AuthorX_YYYY" format (unique)
               - If conflict: append letter (e.g., "Alakhdar_2025a")
               - Replace ONLY the key in bibtex string, keep everything else EXACTLY the same
            3. **CRITICAL**: Preserve EVERYTHING except the key:
               - Keep all other bibtex content (spaces, commas, formatting) EXACTLY the same
               - Keep file_path, title, abstract fields EXACTLY the same
               - Keep dictionary structure EXACTLY the same
            
            **OUTPUT**:
            - Return a complete Python list: `[{...}, {...}, ...]`
            - MUST start with `[` and end with `]`
            - MUST include ALL citations with ALL fields: bibtex, file_path, title, abstract
            - Return ONLY the list, no explanations
        save_as: "related_work_citations"
    
    # Step 6.6: Log normalization done
    - task:
        name: "normalize_related_work_citation_keys_done"
        instruction: |
            **CRITICAL - NO FILE OPERATIONS ALLOWED**:
            This is a logging step only. You MUST NOT use fs_write, fs_read, fs_mkdir, or any other file operations.
            
            **REQUIRED ACTION**:
            Simply return a brief confirmation message: "Related work citation keys normalization is done."
            
            **FORBIDDEN ACTIONS**:
            - DO NOT use fs_write to save any files
            - DO NOT use fs_read to read any files
            - DO NOT use fs_mkdir to create directories
            - DO NOT provide detailed status reports or file listings
            - DO NOT save intermediate results or summaries
            
            Return ONLY the confirmation message.
        save_as: "normalize_related_work_citation_keys_result"
    
    # Step 7: Save into global citations for future use
    - set_variable:
        name: "all_citation"
        value: "{{related_work_citations}}"

    # Step 8: Write Related Work draft
    - task:
        name: "write_related_work"
        instruction: |
            **CRITICAL - NO FILE OPERATIONS ALLOWED**:
            This step is for writing content only. You MUST NOT use fs_write, fs_read, fs_mkdir, or any other file operations.
            DO NOT save any files. DO NOT create any directories. Only return the written content.
            
            {{write_system_prompt_related_work}}

            Please write the Related Work section of the research paper. Follow the instructions and structure strictly.

            **CRITICAL STRUCTURE REQUIREMENT**:
            - Write **3 paragraphs** (at most 4 paragraphs)
            - Each paragraph should focus on a distinct category or theme of related work
            - Use \paragraph{Category Name} to start each paragraph
            - Group related papers together within each paragraph

            An example for related work is:

            \section{Related Work}
            \label{sec:related_work}

            \paragraph{Graph Architecture Search}
            Architecture search techniques have been applied to GNNs \cite{EXAMPLE_CITATION_1,EXAMPLE_CITATION_2}.
            However, these works only focus on the design within each GNN layer instead of a general GNN design space,
            and only evaluate the designs on a small number of node classification tasks.

            \paragraph{Evaluation of GNN Models}
            Multiple works discuss approaches for making fair comparison between GNN models \cite{EXAMPLE_CITATION_3,EXAMPLE_CITATION_4,EXAMPLE_CITATION_5}.
            However, these models only consider some specific GNN designs (\eg, GCN, GAT, GraphSAGE), while our approach extensively explores the general design space of GNNs.

            \paragraph{Other graph learning models} 
            We focus on message passing GNNs due to their proven performance and efficient implementation over various GNN tasks. There are alternative designs of graph learning models \cite{EXAMPLE_CITATION_6,EXAMPLE_CITATION_7,EXAMPLE_CITATION_8,EXAMPLE_CITATION_9}, but their design spaces are different from GNNs and are less modularized.

            \paragraph{Transferable Architecture Search}
            The idea of transferring architecture search results across tasks has been studied in the context of computer vision tasks \cite{EXAMPLE_CITATION_10,EXAMPLE_CITATION_11}.
            Meta-level architecture design has also been studied in \cite{EXAMPLE_CITATION_12,EXAMPLE_CITATION_13,EXAMPLE_CITATION_14,EXAMPLE_CITATION_15}, with the assumption that different tasks follow the same distribution (\eg, variants of ImageNet dataset \cite{EXAMPLE_CITATION_16}).
            These approaches often make an assumption that a single neural architecture may perform well on all tasks, which fits well for tasks with relatively low variety.
            However, due to the great variety of graph learning tasks, such assumption no longer holds.

            Some tips for writing a strong Related Work section:

            {{related_work_tips}}

            - Academic siblings of our work, i.e. alternative attempts in literature at trying to solve the same problem.
            - Goal is to “Compare and contrast” - how does their approach differ in either assumptions or method? If their method is applicable to our Problem Setting I expect a comparison in the experimental section. If not, there needs to be a clear statement why a given method is not applicable.
            - Note: Just describing what another paper is doing is not enough. We need to compare and contrast.

            **RESEARCH IDEA**:
            {{idea_data}}

            **CRITICAL - CITATION SOURCE RESTRICTION (READ CAREFULLY)**:
            - The RESEARCH IDEA text may contain reference-like strings, citation keys, or a "References" list.
            - You MUST NOT cite anything that comes from the RESEARCH IDEA text.
            - You MUST cite ONLY from the provided `RELATED WORK CITATIONS` list below.
            - The ONLY allowed citation keys are the bibtex keys explicitly provided in RELATED WORK CITATIONS.

            You must ground your discussion using **only** the following pre-selected relevant papers.
            Each paper is formatted as: **[bibtex_key]** Paper Title (authors, venue, year)

            CRITICAL: When citing a paper, you MUST use the bibtex_key shown in square brackets [].
            For example, if you see **[gao2019graphnas]** GraphNAS..., you must write \cite{gao2019graphnas}

            Use LaTeX `\cite{...}` format **strictly** to reference these works. Do not add any new citations.
            You must cite **all** of the following papers at least once using \cite{...}.
            Do not leave out any item from the list.

            **MEANINGFUL CITATION USAGE**:
            - Each citation must support a specific claim about that paper's contribution or approach
            - Cite papers when discussing their methods, findings, or limitations
            - Group related papers together and cite them when making comparative statements
            - Do NOT just list papers with citations at the end - integrate them into your arguments
            - Example: "Prior work has explored X~\cite{paper1,paper2}, but these approaches suffer from Y~\cite{paper3,paper4}."

            RELATED WORK CITATIONS:
            {{related_work_citations}}
            
            Begin with:
            \section{Related Work}
            \label{sec:related_work}
            ...
        save_as: "related_work_draft"

    # Step 9: Log step done to avoid long text output from last step overflow context window by carry over step
    - task:
        name: "related_work_draft_done"
        instruction: |

            DO NOT save any files. Only return the written content.
            
            {{write_system_prompt}}

            You are writing the Introduction section of a top-tier research paper proposal.
            
            **CRITICAL FORMAT REQUIREMENTS**:
            - Use `\section{Introduction}` (single backslash), NOT `\\section{Introduction}` (double backslash - WRONG)
            - Use `\cite{...}` (single backslash), NOT `\\cite{...}` (double backslash - WRONG)
            - Use `\paragraph{...}` (single backslash), NOT `\\paragraph{...}` (double backslash - WRONG)
            - Use `\textit{...}` (single backslash), NOT `\\textit{...}` (double backslash - WRONG)
            - DO NOT output double backslashes anywhere - always use single backslash
            - Example: Write `\section{Introduction}` NOT `\\section{Introduction}`

            **CRITICAL - CITATION PLACEMENT**:
            - DO NOT use placeholder citations like EXAMPLE_CITATION_1, EXAMPLE_CITATION_2, etc.
            - If you need to cite related work but don't have specific citation keys yet, you can:
              (1) Write the content without citations, and citations will be added in a later step, OR
              (2) Use generic references like "prior work" or "recent studies" without \cite{} commands
            - DO NOT copy EXAMPLE_CITATION placeholders from examples - they are just examples of structure, not actual citations to use
            - The actual citations will be added in Step 20 (add_citation_for_intro_draft) after searching for relevant papers

            An example for an introduction should look like (note: citations are placeholders for structure only, DO NOT use them):
            
            \section{Introduction}
            \label{sec:introduction}

            LLMs have proved to be powerful copilots in scientific research~\citep{EXAMPLE_CITATION_1}, demonstrating their great potential for accelerating scientific discovery.
            Despite the promising finding, a more ambitious question remains: \textit{Can we simulate the human research community with LLMs}? Answering such a question has multiple benefits: (1) simulating the human research community helps understand the underlying process behind the discovery of existing research ideas; (2) it can further help democratize and accelerate the discovery process of new research ideas.

            However, simulating the human research community is challenging, as it involves leveraging multiple LLM agents to interact with complex research data. While existing multi-agent LLM frameworks have been successfully applied to areas like social simulation~\citep{EXAMPLE_CITATION_2,EXAMPLE_CITATION_3} and game simulation~\citep{EXAMPLE_CITATION_4,EXAMPLE_CITATION_5}, they are not well-suited for simulating research communities due to the complexity of collaborative research activities like paper writing and review writing. Although recent efforts have explored research automation using LLMs, these frameworks are typically limited to specific research tasks, such as idea generation~\citep{EXAMPLE_CITATION_6, EXAMPLE_CITATION_7} or code experimentation~\citep{EXAMPLE_CITATION_8}, or focus on simulating single-agent workflows~\citep{EXAMPLE_CITATION_9}. These frameworks cannot simulate collaborative research activities where researchers with diverse backgrounds work together to brainstorm ideas, review papers, etc—processes that are fundamental to modern human research.

            \paragraph{Research community as graph}
            Our key observation is that the deeply interconnected research community can be naturally represented as graphs. Indeed, similar graph structures like citation networks~\citep{EXAMPLE_CITATION_10} and academic social networks~\citep{EXAMPLE_CITATION_11} have been extensively studied within data mining research, with proven values in applications such as citation prediction~\citep{EXAMPLE_CITATION_12}, recommendation~\citep{EXAMPLE_CITATION_13}, and community detection~\citep{EXAMPLE_CITATION_14}.
            However, introducing LLMs to a graph-structured research community can extend these previous works from prediction and analysis with existing data to dynamic simulation and real-time forecasting.

            \paragraph{Novel framework for research simulation}
            In this work, we propose \envname, a simulator of the human research community. To bridge the gap between existing multi-agent simulation frameworks and the complexity of research activities, we propose a graph-based framework, inspired by the message-passing mechanism in Graph Neural Networks (GNNs), for multi-agent simulation.
            Concretely, as shown in Figure \ref{fig:community-graph}, we propose a new concept of \textit{agent-data graph} with 2 generic types of nodes: (1) \textit{agent} nodes, suitable for entities like agents; (2) \textit{data} nodes, suitable for entities such as papers, reviews, and blogs.
            Agent-data graphs are unique from standard heterogeneous graphs; here, the key conceptual difference between agent and data nodes is that an agent node can be considered a function over data nodes.
            To inference on agent-data graphs, we propose a \textit{TextGNN} framework where message-passing processes are defined based on text-form information processing with LLMs, thanks to their strong in-context learning~\citep{EXAMPLE_CITATION_15} and reasoning~\citep{EXAMPLE_CITATION_16} ability.
            We apply the proposed agent-data graph and TextGNN to the research simulation. Here, a research community can be regarded as a special form of agent-data graph, called \textit{community graph}, with research agents and research papers as two types of nodes, and we consider three types of edges (review, author, and cite) in the graph. Different community activities, such as paper writing and review writing, can be modeled as special message-passing processes on the community graph.

            \paragraph{Novel evaluation for research simulation}
            With \envname for research simulation, a further research question is to evaluate the quality of that. Prior works primarily use human evaluation with breakdown metrics such as novelty, excitement, feasibility, and expected effectiveness~\citep{EXAMPLE_CITATION_17,EXAMPLE_CITATION_18}. These approaches inevitably suffer from subjectiveness and high costs. In our work, since \envname functions as a simulator, our primary focus is on measuring how closely its outputs align with those of the real-world research community. Community graphs naturally provide a similarity-based evaluation method by masking a given paper node in the community graph and evaluating whether a simulator can reconstruct the masked nodes. This definition focuses on simulation similarity, making it scalable and objective. Based on such a node masking prediction task, we build a benchmark called \benchname with 1,000 paper writing tasks and 200 review writing tasks requiring multi-agent collaboration.

            \paragraph{Main discoveries} Based on the evaluation results from \benchname, we highlight three key findings: (1) \envname effectively simulates collaborative research activities, achieving an average similarity score of 0.68 for paper writing and 0.49 for review writing, as measured by the state-of-the-art text embedding model; (2) \envname demonstrates robustness and effectiveness in research simulation, showing improvement when more agents are added and maintaining performance when including unrelated papers; (3) \envname inspires interdisciplinary research, generating innovative ideas that combine insights from NLP, criminology, and astronomy and does not exist in the real-world research.



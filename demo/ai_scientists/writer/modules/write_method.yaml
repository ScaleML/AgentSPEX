name: "write_method_module"
goal: "Write Method section with complex LaTeX formulas using gpt-5.2 model"

# Use gpt-5.2 for better LaTeX formula handling
config:
    model: "gpt-5.2"
    max_tokens_per_step: 150000
    max_tool_calls_per_step: 30
    plan_revision_max_steps: 0

# Parameters from parent workflow
parameters:
    # NOTE: Parent workflow passes params via env vars using UPPERCASE keys
    write_system_prompt: "${WRITE_SYSTEM_PROMPT}"
    idea_data: "${IDEA_DATA}"
    method_tips: "${METHOD_TIPS}"
    related_work_draft: "${RELATED_WORK_DRAFT}"
    enriched_introduction_draft: "${ENRICHED_INTRODUCTION_DRAFT}"

workflow:
    # Write Method section
    - task:
        name: "write_method"
        instruction: |
            **CRITICAL - NO FILE OPERATIONS ALLOWED**:
            This step is for writing content only. You MUST NOT use fs_write, fs_read, fs_mkdir, or any other file operations.
            DO NOT save any files. DO NOT create any directories. Only return the written content.
            
            {{write_system_prompt}}

            Please fill in the Method section of the writeup. The Method section should **clearly define the approach taken in this study**, ensuring that readers can understand and, if needed, replicate the implementation.

            **THE RESEARCH IDEA**:
            {{idea_data}}
            
            **CRITICAL - DO NOT CITE FROM THE RESEARCH IDEA**:
            - The research idea text may contain reference-like strings or citation keys.
            - You MUST NOT add citations based on anything mentioned inside the research idea text.
            - Only cite papers whose citation keys already appear in the provided previous sections below.
            - Never invent new citation keys.

            Some tips are provided below:
            {{method_tips}}

            **IMPORTANT GUIDELINES**:
            1. Structure your Method section with multiple \paragraph{} blocks (minimum 3-5)
            2. Start with formal problem definition using mathematical notation
            3. Include equations for key transformations (use \begin{align}...\end{align} for long equation)
            4. For each major component, explain BOTH what it does AND why (design rationale)
            5. Build upon the motivation from previous sections while introducing technical details
            6. Ensure the Method section fully elaborates on the approach outlined in the research idea

            **IMPORTANT**: You have access to the previous sections that were already written. Make sure your Method section builds upon the motivation and problem definition established earlier, while introducing your technical approach clearly and coherently.

            **Previous content:**
            \section{Related Work}
            {{related_work_draft}}

            \section{Introduction}
            {{enriched_introduction_draft}}

            Be sure to use \cite or \citet where relevant, referring to the works provided in the file.
            Do not cite anything that is not already in `references.bib`. Do not add any new entries to this.

            **Citation Usage**: Each citation must support a specific claim in that sentence (e.g., cite papers when referencing their methods, when building upon their techniques, or when comparing approaches).

            **CRITICAL - LaTeX Math Format**:
            - For inline math, use $...$
            - For display math, use \begin{equation}...\end{equation}
            - For multi-line equations, use \begin{align}...\end{align}
            - DO NOT use \\( or \\[ (double backslash) - these will be rendered as literal text. Example: \(x = y + z\) (correct) NOT \\(x = y + z\\) (wrong)
            - DO NOT use literal \n for line breaks - use actual line breaks (press Enter)
            
            **CRITICAL - MATH MODE MUST BE CLOSED (PAY EXTRA ATTENTION)**:
            - Any time you write mathematics, it MUST be inside math mode delimiters.
            - Every `$` MUST have a matching closing `$` (never leave a dangling `$`).
            - Before finishing, quickly scan to ensure there are NO unclosed `$` anywhere in the section.

            Keep the experimental results (figures and tables) only in the Results section, and make sure that any captions are filled in. DO NOT SAY CONCRETE EXPERIMENTAL SETUP IN METHOD SECTION. JUST DESCRIBE THE ALGORITHM AND THE MAJOR COMPONENT OF YOUR METHOD.
            In this pass, do not reference anything in later sections of the paper.

            Begin with:
            \section{Method}
            \label{sec:method}
            ...
        save_as: "method_draft"
    
    - return: "method_draft"


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptimalScale AI Scientist — Setup</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #1e293b;
            border-radius: 16px;
            padding: 48px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #f8fafc;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 32px;
            font-size: 14px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        label .required {
            color: #f87171;
            margin-left: 2px;
        }
        label .optional {
            color: #64748b;
            font-weight: 400;
            font-size: 12px;
            margin-left: 4px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn:hover { background: #2563eb; }
        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            background: #064e3b;
            border: 1px solid #059669;
            color: #6ee7b7;
            display: block;
        }
        .message.error {
            background: #450a0a;
            border: 1px solid #dc2626;
            color: #fca5a5;
            display: block;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff40;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>OptimalScale AI Scientist Setup</h1>
        <p class="subtitle">
            Welcome! Configure your API keys to get started.
            This page only appears on first boot.
        </p>

        <div class="form-group">
            <label>OpenAI API Key <span class="required">*</span></label>
            <input type="password" id="openai_key" placeholder="sk-..." autocomplete="off">
            <p class="hint">Required for proposal generation. Get one at platform.openai.com</p>
        </div>

        <div class="form-group">
            <label>Firecrawl API Key <span class="optional">(optional)</span></label>
            <input type="password" id="firecrawl_key" placeholder="fc-..." autocomplete="off">
            <p class="hint">For citation search. Get one at firecrawl.dev</p>
        </div>

        <button class="btn" id="saveBtn" onclick="submitSetup()">Save & Start</button>

        <div class="message" id="msg"></div>
    </div>

    <script>
        async function submitSetup() {
            const btn = document.getElementById('saveBtn');
            const msg = document.getElementById('msg');
            const openaiKey = document.getElementById('openai_key').value.trim();
            const firecrawlKey = document.getElementById('firecrawl_key').value.trim();

            if (!openaiKey) {
                msg.className = 'message error';
                msg.textContent = 'OpenAI API Key is required.';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Saving...';
            msg.style.display = 'none';

            try {
                const resp = await fetch('/api/setup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        openai_api_key: openaiKey,
                        firecrawl_api_key: firecrawlKey
                    })
                });
                const data = await resp.json();

                if (resp.ok) {
                    msg.className = 'message success';
                    msg.textContent = data.message;
                    btn.innerHTML = '<span class="spinner"></span>Starting services...';

                    // Redirect to the main web UI after services start
                    setTimeout(() => {
                        msg.textContent += ' Redirecting...';
                        setTimeout(() => { window.location.reload(); }, 10000);
                    }, 20000);
                } else {
                    msg.className = 'message error';
                    msg.textContent = data.error || 'Setup failed.';
                    btn.disabled = false;
                    btn.textContent = 'Save & Start';
                }
            } catch (e) {
                msg.className = 'message error';
                msg.textContent = 'Connection error: ' + e.message;
                btn.disabled = false;
                btn.textContent = 'Save & Start';
            }
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitSetup();
        });
    </script>
</body>
</html>

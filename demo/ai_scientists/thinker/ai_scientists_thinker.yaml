                    ✅ **Core Domains** (only if essential): "molecular", "protein", "genomic" (only if it's a core part of the task)
                    
                    **WHAT TO IGNORE - NON-ESSENTIAL WORDS**:
                    ❌ Modifiers: "de novo", "multi-objective", "synthetic feasibility", "scaffold-aware", "novel", "advanced"
                    ❌ Implementation details: "Bayesian neural nets", "MC dropout", "differentiable property predictors", "active learning loop"
                    ❌ Generic terms: "deep learning", "machine learning", "AI" (unless it's the only method mentioned)
                    ❌ Vague terms: "neural networks" (specify which type: "graph neural network", "transformer", etc.)
                    ❌ Abbreviations without context: "RL", "NLP", "GNN" (use full names)
                    ❌ Connectors and context: "for", "with", "using", "by", "in", "on", "to"
                    
                    **FORMAT EXAMPLES** (showing analysis process, NOT content to copy):
                    - Idea: "scaffold-guided diffusion with active learning for multi-target de novo molecular design"
                      → Analysis: Core method = "diffusion model", Core task = "molecular design"
                      → Query: "diffusion model AND molecular design" (1 AND, 2 concepts - optimal)
                    
                    - Idea: "hierarchical attention mechanism for text classification"
